<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Car Wash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700;800&display=swap">
<style>
  :root { --bg: #f1f5f9; --card: #fff; --ink: #0f172a; --muted: #64748b; --brand: #0369a1; --ok: #16a34a; --wait: #d97706; --line: #e2e8f0; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Sarabun", "Noto Sans Sinhala", "Noto Sans Thai", "Nirmala UI", "Iskoola Pota", system-ui, sans-serif; }
  header { background: var(--brand); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 19px; flex: 1; text-align: center; }
  .langs { display: flex; gap: 2px; background: #ffffff22; border-radius: 99px; padding: 2px; }
  .langs button { border: 0; background: transparent; color: #e0f2fe; font: inherit; font-size: 13px; padding: 3px 9px; border-radius: 99px; cursor: pointer; }
  .langs button.on { background: #fff; color: var(--brand); font-weight: 700; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .big { font-size: 46px; font-weight: 800; text-align: center; letter-spacing: 1px; }
  .plate { text-align: center; font-size: 19px; color: var(--muted); }
  .status { text-align: center; font-size: 24px; font-weight: 700; margin: 14px 0 4px; }
  .status.ready { color: var(--ok); }
  .sub { text-align: center; color: var(--muted); }
  .steps { display: flex; justify-content: space-between; margin: 18px 0 6px; position: relative; }
  .steps::before { content: ""; position: absolute; top: 13px; left: 8%; right: 8%; height: 3px; background: var(--line); }
  .step { position: relative; flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
  .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--line); margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .step.on .dot { background: var(--brand); color: #fff; } .step.on { color: var(--ink); font-weight: 600; }
  .step.now .dot { box-shadow: 0 0 0 5px #bae6fd; }
  .ready-box { background: #dcfce7; border-color: #86efac; }
  .ready-box .status { font-size: 28px; }
  table { width: 100%; border-collapse: collapse; } td { padding: 7px 0; border-bottom: 1px solid var(--line); } td.r { text-align: right; }
  .pts { font-size: 40px; font-weight: 800; text-align: center; color: var(--brand); }
  .note { font-size: 13px; color: var(--muted); text-align: center; }
  .warn { background: #fef3c7; border-radius: 10px; padding: 10px; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body translate="no">
<header><h1 id="shop">Car Wash</h1><div class="langs" id="langs"><button data-l="th">ไทย</button><button data-l="en">EN</button><button data-l="si">සිං</button></div></header>
<main>
  <div id="msg" class="card" hidden></div>

  <div id="ticket" hidden>
    <div class="card" id="tCard">
      <div class="sub" data-i="yourTicket"></div>
      <div class="big" id="tNo"></div>
      <div class="plate" id="tPlate"></div>
      <div class="status" id="tStatus"></div>
      <div class="sub" id="tSub"></div>
      <div class="steps" id="tSteps"></div>
      <div class="warn" id="tStale" hidden data-i="stale"></div>
    </div>
    <div class="card"><div class="sub" data-i="services"></div><div id="tServices" style="text-align:center;margin-top:4px"></div></div>
    <p class="note"><span data-i="autoUpdate"></span> · <span id="tUpdated"></span></p>
  </div>

  <div id="member" hidden>
    <div class="card">
      <div class="sub" data-i="member"></div>
      <div class="big" style="font-size:30px" id="mName"></div>
      <div class="plate" id="mTier"></div>
      <div class="pts" id="mPoints"></div>
      <div class="sub" id="mValue"></div>
    </div>
    <div class="card"><div class="sub" style="margin-bottom:6px" data-i="yourPackages"></div><table id="mPkgs"></table></div>
    <p class="note" data-i="showCard"></p>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // [English, Thai, Sinhala]
  const S = {
    yourTicket: ['Your ticket', 'บัตรคิวของคุณ', 'ඔබේ ටිකට්පත'],
    services: ['Services', 'บริการ', 'සේවා'],
    autoUpdate: ['This page updates by itself', 'หน้านี้อัปเดตอัตโนมัติ', 'මෙම පිටුව ස්වයංක්‍රීයව යාවත්කාලීන වේ'],
    lastUpdate: ['shop updated {time}', 'ร้านอัปเดตล่าสุด {time}', 'අවසන් යාවත්කාලීනය {time}'],
    stale: ['⚠️ The status may be out of date. Please ask our staff.', '⚠️ ข้อมูลอาจไม่อัปเดต กรุณาสอบถามพนักงาน', '⚠️ තත්ත්වය යාවත්කාලීන නොවිය හැක. කරුණාකර අපගේ කාර්ය මණ්ඩලයෙන් විමසන්න.'],
    s_waiting: ['Waiting', 'รอคิว', 'බලා සිටින'],
    s_washing: ['Washing', 'กำลังล้าง', 'සෝදමින්'],
    s_finishing: ['Finishing', 'กำลังเก็บงาน', 'අවසන් කරමින්'],
    s_ready: ['Your car is ready!', 'รถของคุณเสร็จแล้ว เชิญรับรถได้เลย!', 'ඔබේ වාහනය සූදානම්!'],
    s_done: ['Picked up. Thank you!', 'รับรถแล้ว ขอบคุณค่ะ', 'රැගෙන ගියා. ස්තූතියි!'],
    s_cancelled: ['Cancelled', 'ยกเลิก', 'අවලංගු කළා'],
    step_waiting: ['Waiting', 'รอคิว', 'බලා සිටින'],
    step_washing: ['Washing', 'กำลังล้าง', 'සෝදමින්'],
    step_ready: ['Ready', 'เสร็จแล้ว', 'සූදානම්'],
    step_done: ['Picked up', 'รับรถแล้ว', 'රැගෙන ගියා'],
    ahead: ['{n} car(s) ahead of you', 'มีรถก่อนหน้า {n} คัน', 'ඔබට ඉදිරියෙන් වාහන {n}ක්'],
    next: ['You are next', 'คันถัดไปคือคุณ', 'ඊළඟට ඔබයි'],
    readyAround: ['Ready around {time} (~{min} min)', 'เสร็จประมาณ {time} (~{min} นาที)', '{time} පමණ සූදානම් (~මිනි. {min})'],
    bay: ['Bay {n}', 'ช่อง {n}', 'ස්ථානය {n}'],
    notFound: ['Ticket not found. It may already be picked up.', 'ไม่พบบัตรคิวนี้ อาจรับรถไปแล้ว', 'ටිකට්පත හමු නොවීය. දැනටමත් රැගෙන ගොස් ඇති විය හැක.'],
    scanPrompt: ['Please scan the QR code on your ticket or member card.', 'กรุณาสแกน QR code บนบัตรคิวหรือบัตรสมาชิก', 'කරුණාකර ඔබේ ටිකට්පතේ හෝ සාමාජික කාඩ්පතේ QR කේතය ස්කෑන් කරන්න.'],
    retry: ['Connection problem, retrying…', 'เชื่อมต่อไม่ได้ กำลังลองใหม่…', 'සම්බන්ධතා ගැටලුවක්, නැවත උත්සාහ කරමින්…'],
    connErr: ['Connection problem. Please try again.', 'เชื่อมต่อไม่ได้ กรุณาลองใหม่', 'සම්බන්ධතා ගැටලුවක්. කරුණාකර නැවත උත්සාහ කරන්න.'],
    member: ['Member', 'สมาชิก', 'සාමාජිකයා'],
    hello: ['Hi {name}', 'คุณ {name}', 'ආයුබෝවන් {name}'],
    points: ['points', 'แต้ม', 'ලකුණු'],
    worth: [' · worth {v}', ' · มูลค่า {v}', ' · වටිනාකම {v}'],
    yourPackages: ['Your packages', 'แพ็กเกจของคุณ', 'ඔබේ පැකේජ'],
    left: ['{n} left', 'เหลือ {n}', 'ඉතිරි {n}'],
    until: ['until {date}', 'ถึง {date}', '{date} දක්වා'],
    noPkgs: ['No packages yet. Ask our staff!', 'ยังไม่มีแพ็กเกจ สอบถามพนักงานได้เลย', 'තවම පැකේජ නැත. අපගේ කාර්ය මණ්ඩලයෙන් විමසන්න!'],
    showCard: ['Show this page or your member card when you visit.', 'แสดงหน้านี้หรือบัตรสมาชิกเมื่อมาใช้บริการ', 'පැමිණෙන විට මෙම පිටුව හෝ ඔබේ සාමාජික කාඩ්පත පෙන්වන්න.'],
    memberNotFound: ['Member not found. Please ask our staff.', 'ไม่พบข้อมูลสมาชิก กรุณาติดต่อร้าน', 'සාමාජිකයා හමු නොවීය. කරුණාකර අපගේ කාර්ය මණ්ඩලයෙන් විමසන්න.'],
  };
  const LANGS = ['en', 'th', 'si'], LOCALE = { en: 'en-GB', th: 'th-TH', si: 'si-LK' };
  const q = new URLSearchParams(location.search);
  let saved = null; try { saved = localStorage.getItem('cwLang'); } catch (e) {}
  let lang = LANGS.includes(saved) ? saved : LANGS.includes(q.get('l')) ? q.get('l') : 'th';
  const T = (k, v) => { const r = S[k]; let s = r ? r[LANGS.indexOf(lang)] : k; if (v) s = s.replace(/\{(\w+)\}/g, (m, x) => (v[x] ?? m)); return s; };
  const time = (ms) => new Date(ms).toLocaleTimeString(LOCALE[lang], { hour: '2-digit', minute: '2-digit' });
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach((e) => { e.textContent = T(e.dataset.i); });
    document.querySelectorAll('#langs button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  }
  $('langs').onclick = (e) => {
    const b = e.target.closest('[data-l]'); if (!b) return;
    lang = b.dataset.l; try { localStorage.setItem('cwLang', lang); } catch (err) {}
    applyLang(); last && (last.kind === 't' ? drawTicket(last.j) : drawMember(last.j));
    if (msgKey) show(msgKey, msgExtra);
  };

  const id = q.get('s') || '', t = q.get('t') || '', m = q.get('m') || '';
  const API = /^[\w-]{20,120}$/.test(id) ? `https://script.google.com/macros/s/${id}/exec` : '';
  let msgKey = '', msgExtra = '', last = null, wasReady = false, timer;
  const show = (key, extra = '') => { msgKey = key; msgExtra = extra; $('msg').innerHTML = esc(T(key)) + extra; $('msg').hidden = false; };
  const hideMsg = () => { msgKey = ''; $('msg').hidden = true; };
  applyLang();
  if (!API || (!t && !m)) return show('scanPrompt');

  async function get(params) { const r = await fetch(`${API}?${new URLSearchParams(params)}`); return r.json(); }
  function shop(s) {
    if (!s) return;
    if (s.name) { $('shop').textContent = s.name; document.title = s.name; }
    if (!saved && !q.get('l') && LANGS.includes(s.lang) && s.lang !== lang) { lang = s.lang; applyLang(); }   // shop's language by default
  }

  const STEPS = ['waiting', 'washing', 'ready', 'done'], ICON = ['⏳', '🧽', '✅', '🚗'];
  const ORDER = { waiting: 0, washing: 1, finishing: 1, ready: 2, done: 3 };
  function drawTicket(j) {
    const x = j.ticket, now = j.now || Date.now(), st = x.status;
    $('tNo').textContent = x.no; $('tPlate').textContent = x.plate; $('tServices').textContent = x.services;
    $('tStatus').textContent = T('s_' + st); $('tStatus').className = 'status' + (st === 'ready' ? ' ready' : '');
    $('tCard').classList.toggle('ready-box', st === 'ready');
    const mins = x.eta ? Math.max(1, Math.round((x.eta - now) / 60000)) : null;
    const eta = mins ? T('readyAround', { time: time(x.eta), min: mins }) : '';
    $('tSub').innerHTML = st === 'waiting' ? `${esc(x.ahead > 0 ? T('ahead', { n: x.ahead }) : T('next'))}<br>${esc(eta)}`
      : (st === 'washing' || st === 'finishing') ? esc(T('bay', { n: x.bay }) + (eta ? ' · ' + eta : '')) : '';
    const cur = ORDER[st] ?? -1;
    $('tSteps').innerHTML = STEPS.map((k, i) => `<div class="step ${i <= cur ? 'on' : ''} ${i === cur ? 'now' : ''}"><div class="dot">${ICON[i]}</div>${esc(T('step_' + k))}</div>`).join('');
    $('tSteps').hidden = st === 'cancelled';
    $('tStale').hidden = !(j.updated && now - j.updated > 6 * 60000 && ['waiting', 'washing', 'finishing'].includes(st));
    $('tUpdated').textContent = j.updated ? T('lastUpdate', { time: time(j.updated) }) : '';
  }
  async function loadTicket() {
    try {
      const j = await get({ action: 'ticket', t });
      shop(j.shop);
      if (!j.ok) { $('ticket').hidden = true; return show('notFound', j.shop && j.shop.phone ? `<br><br>📞 ${esc(j.shop.phone)}` : ''); }
      hideMsg(); $('ticket').hidden = false;
      last = { kind: 't', j }; drawTicket(j);
      const st = j.ticket.status;
      if (st === 'ready' && !wasReady) { wasReady = true; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} }
      clearTimeout(timer);
      if (st !== 'done' && st !== 'cancelled') timer = setTimeout(loadTicket, document.hidden ? 60000 : 15000);
    } catch (e) {
      show('retry');
      clearTimeout(timer); timer = setTimeout(loadTicket, 20000);
    }
  }

  function drawMember(j) {
    const x = j.member, cur = (j.shop && j.shop.currency) || '฿';
    $('member').hidden = false;
    $('mName').textContent = T('hello', { name: x.name });
    $('mTier').textContent = `${x.id} · ${x.tier}`;
    $('mPoints').textContent = `⭐ ${Number(x.points).toLocaleString()}`;
    $('mValue').textContent = T('points') + (x.pointsValue ? T('worth', { v: cur + Number(x.pointsValue).toLocaleString() }) : '');
    const rows = [...x.credits.map((c) => `<tr><td>🎟️ ${esc(c.name)}</td><td class="r"><b>${esc(T('left', { n: c.left }))}</b><br><small>${esc(T('until', { date: c.expires }))}</small></td></tr>`),
      ...x.plans.map((p) => `<tr><td>♾️ ${esc(p.name)}<br><small>${esc(p.plate)}</small></td><td class="r"><b>${esc(T('until', { date: p.expires }))}</b></td></tr>`)];
    $('mPkgs').innerHTML = rows.join('') || `<tr><td class="note">${esc(T('noPkgs'))}</td></tr>`;
  }
  async function loadMember() {
    try {
      const j = await get({ action: 'member', m });
      shop(j.shop);
      if (!j.ok) return show('memberNotFound');
      last = { kind: 'm', j }; drawMember(j);
    } catch (e) { show('connErr'); }
  }

  if (t) { loadTicket(); document.addEventListener('visibilitychange', () => { if (!document.hidden) loadTicket(); }); }
  else loadMember();
})();
</script>
</body>
</html>
